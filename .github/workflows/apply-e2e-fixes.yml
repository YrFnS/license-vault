name: Apply E2E Fixes

on:
  push:
    branches:
      - agent/e2e-license-vault-20260811
    paths:
      - scripts/apply-e2e-fixes.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/e2e-license-vault-20260811
          fetch-depth: 0

      - name: Apply verified source replacements
        run: python scripts/apply-e2e-fixes.py

      - name: Validate and commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/apply-e2e-fixes.yml scripts/apply-e2e-fixes.py
          git add -A
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve production E2E defects"
          git push origin HEAD:agent/e2e-license-vault-20260811
