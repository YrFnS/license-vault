name: Production E2E

on:
  push:
    branches:
      - agent/e2e-license-vault-20260811
  workflow_dispatch:

concurrency:
  group: production-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Run production browser E2E
        env:
          BASE_URL: https://license-vault-self.vercel.app
          E2E_PASSWORD: DemoPass123!
        run: node scripts/e2e-production.mjs

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/e2e/summary.md ]]; then
            cat artifacts/e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-vault-production-e2e-${{ github.run_id }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 14
