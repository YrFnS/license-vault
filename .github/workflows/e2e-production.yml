name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: ${{ github.event_name == 'pull_request' && 'https://license-vault-git-agent-7a13d3-yasserreyadh-gmailcoms-projects.vercel.app' || 'https://license-vault-self.vercel.app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Wait for deployment under test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status="$(curl --location --silent --show-error --output /tmp/landing.html --write-out '%{http_code}' "$BASE_URL/en" || true)"
            if [[ "$status" == "200" ]] && grep -q '>Features<' /tmp/landing.html; then
              echo "Deployment is ready at $BASE_URL"
              exit 0
            fi
            echo "Attempt $attempt/90: deployment not ready (HTTP $status)"
            sleep 10
          done
          echo "Deployment did not become ready at $BASE_URL"
          exit 1

      - name: Run browser E2E
        env:
          E2E_PASSWORD: DemoPass123!
        run: node scripts/e2e-production.mjs

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/e2e/summary.md ]]; then
            cat artifacts/e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-vault-browser-e2e-${{ github.run_id }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 14
