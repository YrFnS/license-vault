name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://license_vault:license_vault@localhost:5432/license_vault
      NEXTAUTH_SECRET: ci-only-nextauth-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      WEBHOOK_SECRET_ENCRYPTION_KEY: ci-only-webhook-encryption-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Unit tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build